            <rect x="170" y="70" width="260" height="260" rx="6" fill="#151820" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
            <!-- Mounting rails -->
            <rect x="185" y="80" width="12" height="240" fill="#222834"/>
            <rect x="403" y="80" width="12" height="240" fill="#222834"/>
